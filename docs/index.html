<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reliable Resources for Agent — 可信资源库</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1a1a1a; --muted:#6b7280; --accent:#166534; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#111827; color:#fff; padding:36px 20px; text-align:center; position:relative; }
  header h1 { margin:0 0 8px; font-size:26px; }
  header p { margin:4px 0; color:#d1d5db; font-size:14px; }
  header .tagline { color:#86efac; font-weight:600; }
  .lang-toggle { position:absolute; top:14px; right:14px; display:flex; border:1px solid #4b5563; border-radius:8px; overflow:hidden; }
  .lang-toggle button { background:transparent; color:#d1d5db; border:0; padding:6px 12px; font-size:13px; cursor:pointer; }
  .lang-toggle button.on { background:#86efac; color:#111827; font-weight:600; }
  .toolbar { max-width:960px; margin:20px auto 0; padding:0 16px; display:flex; gap:10px; flex-wrap:wrap; }
  .toolbar input, .toolbar select { padding:10px 12px; font-size:15px; border:1px solid #d1d5db; border-radius:8px; background:#fff; }
  .toolbar input { flex:1; min-width:200px; }
  .meta { max-width:960px; margin:12px auto 0; padding:0 16px; color:var(--muted); font-size:13px; }
  .grid { max-width:960px; margin:16px auto 60px; padding:0 16px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { background:var(--card); border-radius:12px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:0; font-size:18px; }
  .card .desc { color:#374151; font-size:14px; margin:0; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 10px; border-radius:999px; }
  .b-endorse { background:#dcfce7; color:var(--accent); }
  .b-ref { background:#fef3c7; color:var(--warn); }
  .b-active { background:#e0e7ff; color:#3730a3; }
  .b-degraded { background:#fef3c7; color:var(--warn); }
  .b-dead { background:#fee2e2; color:var(--bad); }
  .evidence { font-size:13px; color:var(--muted); background:#f3f4f6; border-radius:8px; padding:8px 10px; }
  .mirrors { font-size:13px; display:flex; flex-direction:column; gap:6px; }
  .mirror { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:8px 10px; }
  .mirror a { color:#1d4ed8; text-decoration:none; word-break:break-all; }
  .mirror .m-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .visit { display:inline-block; text-align:center; background:#111827; color:#fff; text-decoration:none; padding:10px; border-radius:8px; font-size:15px; margin-top:auto; }
  .visit:hover { background:#1f2937; }
  .risk { font-size:13px; color:var(--bad); }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:30px 16px; }
  footer a { color:#1d4ed8; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <div class="lang-toggle">
    <button id="lang-zh">中文</button><button id="lang-en">EN</button>
  </div>
  <h1>Reliable Resources for Agent</h1>
  <p class="tagline" id="tagline"></p>
  <p id="subtitle"></p>
</header>

<div class="toolbar">
  <input id="q" type="search">
  <select id="cat"></select>
  <select id="lt"></select>
</div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"></div>

<footer id="footer"></footer>

<script>
let RES = [];
let LANG = localStorage.getItem('rra-lang') || 'zh';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STR = {
  zh: {
    tagline: '不信我，信证据。',
    subtitle: '人工审核 · 持续验证 · 防钓鱼 · 同时服务人类与 AI Agent',
    searchPh: '搜索资源名称、描述、标签…',
    allCat: '全部分类', allType: '全部类型',
    endorsed: '推荐收录', reference: '仅防伪·不做推荐',
    meta: (n, m) => `共收录 ${n} 条 · 当前显示 ${m} 条`,
    metaInit: (d, n) => `数据更新于 ${d} · 共收录 ${n} 条`,
    empty: '没有匹配的资源，换个关键词试试。',
    loadFail: '数据加载失败，请稍后重试。',
    evidence: '✅ 验证依据：',
    verifiedAt: '验证于',
    visit: '一键访问官网 →',
    risk: '⚠️ 灰色地带资源：请注意版权与合规风险',
    refNote: '该地址仅用于辨认真伪，本库不做推荐背书。',
    footer: '数据来源 <a href="data.json">data.json</a>（由 <a href="https://github.com/Fangwenky/reliable-resources-for-agent">GitHub 仓库</a> 自动生成）· <a href="https://github.com/Fangwenky/reliable-resources-for-agent/blob/main/CONTRIBUTING.zh-CN.md">贡献指南</a> · 发现失效/钓鱼地址请提 issue',
    cat: {academic:'学术', ebooks:'电子书', 'dev-tools':'开发工具', 'ai-tools':'AI 工具', media:'影音', dataset:'数据集', mirror:'镜像站', other:'其他'},
    status: {active:'可用', degraded:'不稳定', dead:'已失效'},
    htmlLang: 'zh-CN'
  },
  en: {
    tagline: "Don't trust me. Trust the evidence.",
    subtitle: 'Human-reviewed · Continuously verified · Anti-phishing · For humans and AI agents',
    searchPh: 'Search name, description, tags…',
    allCat: 'All categories', allType: 'All types',
    endorsed: 'Endorsed', reference: 'Reference only · no endorsement',
    meta: (n, m) => `${n} resources · showing ${m}`,
    metaInit: (d, n) => `Updated ${d} · ${n} resources`,
    empty: 'No matches — try another keyword.',
    loadFail: 'Failed to load data. Please retry later.',
    evidence: '✅ Evidence: ',
    verifiedAt: 'verified ',
    visit: 'Visit official site →',
    risk: '⚠️ Gray-area resource: mind copyright/compliance risks',
    refNote: 'This address is for authenticity checks only; the registry does not endorse it.',
    footer: 'Data: <a href="data.json">data.json</a> (auto-generated from the <a href="https://github.com/Fangwenky/reliable-resources-for-agent">GitHub repo</a>) · <a href="https://github.com/Fangwenky/reliable-resources-for-agent/blob/main/CONTRIBUTING.md">Contributing</a> · Report dead/phishing URLs via issues',
    cat: {academic:'Academia', ebooks:'E-books', 'dev-tools':'Dev Tools', 'ai-tools':'AI Tools', media:'Media', dataset:'Datasets', mirror:'Mirrors', other:'Other'},
    status: {active:'Active', degraded:'Degraded', dead:'Dead'},
    htmlLang: 'en'
  }
};

const t = () => STR[LANG];
const rname = r => LANG === 'en' ? (r.name_en || r.name) : r.name;
const rdesc = r => LANG === 'en' ? (r.description_en || r.description) : r.description;

function badge(cls, txt){ return `<span class="badge ${cls}">${esc(txt)}</span>`; }

function card(r){
  const s = t();
  const lt = r.listing_type === 'reference'
    ? badge('b-ref', s.reference)
    : badge('b-endorse', s.endorsed);
  const st = badge('b-'+r.status, s.status[r.status] || r.status);
  const v = r.verification || {};
  const mirrors = (r.mirrors||[]).map(m =>
    `<div class="mirror"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a><span class="m-meta">${esc(m.region||'')}${m.region?' · ':''}${esc(s.verifiedAt)}${esc(m.last_verified||'')}</span></div>`
  ).join('');
  const risk = r.risk === 'gray-area' ? `<div class="risk">${esc(s.risk)}</div>` : '';
  const refNote = r.listing_type === 'reference' ? `<div class="evidence">${esc(s.refNote)}</div>` : '';
  return `<div class="card">
    <h2>${esc(rname(r))}</h2>
    <div class="badges">${lt}${st}${badge('b-active', s.cat[r.category]||r.category)}</div>
    <p class="desc">${esc(rdesc(r))}</p>
    ${risk}${refNote}
    <div class="evidence">${esc(s.evidence)}${esc(v.evidence||'')}（${esc(v.method||'')} · ${esc(v.verified_at||'')}）</div>
    ${mirrors ? `<div class="mirrors">${mirrors}</div>` : ''}
    <a class="visit" href="${esc(r.homepage)}" target="_blank" rel="noopener">${esc(s.visit)}</a>
  </div>`;
}

function render(){
  const s = t();
  const q = $('q').value.trim().toLowerCase();
  const cat = $('cat').value, lt = $('lt').value;
  const list = RES.filter(r => {
    if (cat && r.category !== cat) return false;
    if (lt && r.listing_type !== lt) return false;
    if (q) {
      const hay = [r.name, r.name_en, r.description, r.description_en, r.id, (r.tags||[]).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  $('meta').textContent = s.meta(RES.length, list.length);
  $('grid').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${esc(s.empty)}</div>`;
}

function applyLang(){
  const s = t();
  document.documentElement.lang = s.htmlLang;
  $('tagline').textContent = s.tagline;
  $('subtitle').textContent = s.subtitle;
  $('q').placeholder = s.searchPh;
  $('lang-zh').classList.toggle('on', LANG === 'zh');
  $('lang-en').classList.toggle('on', LANG === 'en');
  // rebuild selects
  const catSel = $('cat'), ltSel = $('lt');
  const catVal = catSel.value, ltVal = ltSel.value;
  catSel.innerHTML = `<option value="">${esc(s.allCat)}</option>`;
  [...new Set(RES.map(r => r.category))].forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = s.cat[c] || c;
    catSel.appendChild(o);
  });
  catSel.value = catVal;
  ltSel.innerHTML = `<option value="">${esc(s.allType)}</option>
    <option value="endorsed">${esc(s.endorsed)}</option>
    <option value="reference">${esc(s.reference)}</option>`;
  ltSel.value = ltVal;
  $('footer').innerHTML = s.footer;
  render();
}

function setLang(l){
  LANG = l;
  localStorage.setItem('rra-lang', l);
  applyLang();
}

$('lang-zh').addEventListener('click', () => setLang('zh'));
$('lang-en').addEventListener('click', () => setLang('en'));

fetch('data.json').then(r => r.json()).then(d => {
  RES = d.resources || [];
  const s = t();
  $('meta').textContent = s.metaInit(d.updated_at, RES.length);
  applyLang();
}).catch(() => { $('grid').innerHTML = `<div class="empty">${esc(t().loadFail)}</div>`; });

$('q').addEventListener('input', render);
$('cat').addEventListener('change', render);
$('lt').addEventListener('change', render);
</script>
</body>
</html>
