<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reliable Resources for Agent — 人工审核、持续验证的可信互联网资源库，防钓鱼，同时服务人类用户与 AI Agent。Human-reviewed, continuously verified registry of trustworthy internet resources.">
<title>Reliable Resources for Agent — 可信资源库</title>
<style>
  :root {
    --bg:#f6f7f4; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e6e8e0;
    --hero:#0b1220; --hero2:#14213a; --accent:#047857; --accent-bg:#ecfdf5;
    --amber-bg:#fffaeb; --amber:#b45309; --blue-bg:#eff6ff; --blue:#1d4ed8;
    --red-bg:#fef2f2; --red:#b91c1c; --radius:14px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:76px; }

  /* ---------- slim sticky top nav ---------- */
  .topnav { position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topnav-inner { max-width:1024px; margin:0 auto; height:56px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; color:var(--ink); text-decoration:none; }
  .brand svg { width:22px; height:22px; }
  .nav-actions { display:flex; align-items:center; gap:8px; }
  .nav-link { color:var(--muted); text-decoration:none; font-size:13px; font-weight:600; padding:7px 10px; border-radius:8px; }
  .nav-link:hover { color:var(--ink); background:#f2f4f7; }
  .nav-dropdown { position:relative; }
  .nav-cat-btn { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:13px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer; }
  .nav-cat-btn:hover { border-color:var(--ink); }
  .nav-cat-btn svg { width:13px; height:13px; transition:transform .15s; }
  .nav-dropdown.open .nav-cat-btn svg { transform:rotate(180deg); }
  .dropdown { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); min-width:190px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 34px rgba(16,24,40,.14); padding:6px; }
  .dropdown[hidden] { display:none; }
  .dropdown button { display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; border:0; background:transparent; padding:9px 12px; font-size:13.5px; color:var(--ink); border-radius:8px; cursor:pointer; text-align:left; }
  .dropdown button:hover { background:#f2f4f7; }
  .dropdown .cnt { font-size:12px; color:var(--muted); background:#f2f4f7; border-radius:999px; padding:2px 9px; }
  .lang-toggle { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; }
  .lang-toggle button { background:transparent; color:var(--muted); border:0; padding:5px 12px; font-size:12.5px; cursor:pointer; }
  .lang-toggle button.on { background:var(--ink); color:#fff; font-weight:700; }

  /* ---------- compact hero ---------- */
  .hero { background:radial-gradient(900px 380px at 50% -10%, var(--hero2), var(--hero)); color:#fff; position:relative; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; opacity:.45;
    background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size:22px 22px;
    -webkit-mask-image:linear-gradient(to bottom, black 60%, transparent); mask-image:linear-gradient(to bottom, black 60%, transparent); }
  .hero-inner { position:relative; max-width:1024px; margin:0 auto; padding:30px 20px 28px; text-align:center; }
  .hero-badge { display:inline-flex; align-items:center; gap:7px; font-size:11px; letter-spacing:2px; color:#6ee7b7; border:1px solid rgba(110,231,183,.35); padding:5px 13px; border-radius:999px; margin-bottom:12px; }
  .hero-badge .dot { width:7px; height:7px; border-radius:50%; background:#6ee7b7; box-shadow:0 0 8px #6ee7b7; }
  .hero h1 { margin:0 0 8px; font-size:clamp(24px,4.4vw,36px); font-weight:800; letter-spacing:1px; }
  .hero .sub { margin:0 auto 18px; color:#c3cad6; font-size:13.5px; max-width:620px; line-height:1.7; }
  .stats { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .stat { display:flex; align-items:baseline; gap:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 16px; font-size:12.5px; color:#aeb6c6; }
  .stat b { font-size:15px; color:#fff; font-weight:800; }

  /* ---------- search + type filter ---------- */
  .filters { max-width:1024px; margin:18px auto 0; padding:0 20px; display:flex; flex-direction:column; gap:10px; }
  .search-box { position:relative; }
  .search-box svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none; }
  .search-box input { width:100%; padding:12px 16px 12px 42px; font-size:15px; border:1px solid var(--line); border-radius:12px; background:#fff; outline:none; transition:.15s; }
  .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(4,120,87,.12); }
  .seg { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; align-self:flex-start; }
  .seg button { border:0; background:transparent; padding:7px 16px; font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .seg button.on { background:var(--accent-bg); color:var(--accent); font-weight:700; }

  .meta { max-width:1024px; margin:12px auto 0; padding:0 20px; color:var(--muted); font-size:13px; }

  /* ---------- category sections ---------- */
  #sections { max-width:1024px; margin:6px auto 40px; padding:0 20px; }
  #sections[hidden], #grid[hidden] { display:none; }
  .cat-section { margin:26px 0 8px; scroll-margin-top:72px; }
  .cat-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .cat-title { display:flex; align-items:center; gap:10px; }
  .cat-dot { width:13px; height:13px; border-radius:4px; flex:none; }
  .cat-title h2 { margin:0; font-size:19px; font-weight:750; letter-spacing:.3px; }
  .cat-count { font-size:12px; font-weight:700; color:var(--muted); background:#eceee8; border-radius:999px; padding:3px 11px; }
  .expand-btn { border:1px solid var(--line); background:#fff; color:var(--accent); font-size:13px; font-weight:700; padding:7px 15px; border-radius:999px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .expand-btn:hover { border-color:var(--accent); background:var(--accent-bg); }
  .preview-row { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 2px 10px; }
  .preview-row::-webkit-scrollbar { height:8px; }
  .preview-row::-webkit-scrollbar-thumb { background:#d3d7cf; border-radius:4px; }
  .preview-row::-webkit-scrollbar-track { background:transparent; }
  .preview-row .card { flex:0 0 302px; scroll-snap-align:start; }
  .grid-expanded { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); }

  /* ---------- flat grid (search results) ---------- */
  .grid { max-width:1024px; margin:12px auto 40px; padding:0 20px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); }

  /* ---------- cards ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:12px; transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(16,24,40,.1); }
  .card-top { display:flex; gap:13px; align-items:flex-start; }
  .mono { flex:none; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; background:var(--mb,#eef2ff); color:var(--mf,#3730a3); }
  .card-top h2 { margin:1px 0 7px; font-size:17px; font-weight:700; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; letter-spacing:.2px; }
  .b-endorse { background:var(--accent-bg); color:var(--accent); }
  .b-ref { background:var(--amber-bg); color:var(--amber); }
  .b-active { background:var(--blue-bg); color:var(--blue); }
  .b-degraded { background:var(--amber-bg); color:var(--amber); }
  .b-dead { background:var(--red-bg); color:var(--red); }
  .b-cat { background:#f2f4f7; color:var(--muted); }
  .card .desc { color:#344054; font-size:14px; line-height:1.65; margin:0; }
  .evidence { border-left:3px solid var(--accent); background:var(--accent-bg); border-radius:0 10px 10px 0; padding:10px 12px; display:flex; gap:10px; }
  .evidence svg { flex:none; width:18px; height:18px; color:var(--accent); margin-top:1px; }
  .ev-label { font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--accent); margin-bottom:3px; }
  .ev-text { font-size:13px; color:#1d2939; line-height:1.55; }
  .ev-meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .ref-note { background:var(--amber-bg); border-radius:10px; padding:9px 12px; font-size:13px; color:var(--amber); line-height:1.55; }
  .risk { background:var(--red-bg); border-radius:10px; padding:9px 12px; font-size:13px; color:var(--red); line-height:1.55; }
  .mirrors { display:flex; flex-direction:column; gap:6px; }
  .mirror { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  .mirror a { color:var(--blue); text-decoration:none; word-break:break-all; }
  .mirror a:hover { text-decoration:underline; }
  .mirror .m-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .visit { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--ink); color:#fff; text-decoration:none; padding:12px; border-radius:10px; font-size:15px; font-weight:600; margin-top:auto; transition:.15s; }
  .visit:hover { background:#1d2939; }
  .visit svg { width:16px; height:16px; }
  .visit.disabled { background:#d0d5dd; color:#667085; cursor:not-allowed; pointer-events:none; }
  .card.is-dead { opacity:.72; }
  .card.is-dead:hover { transform:none; box-shadow:none; }
  .dead-note { background:var(--red-bg); border-radius:10px; padding:9px 12px; font-size:13px; color:var(--red); line-height:1.55; }

  .empty { text-align:center; color:var(--muted); padding:60px 20px; grid-column:1/-1; }
  .empty .big { font-size:40px; margin-bottom:10px; }

  footer { border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:13px; padding:26px 20px; line-height:2; }
  footer a { color:var(--blue); text-decoration:none; }
  footer a:hover { text-decoration:underline; }

  /* ---------- slim persistent bottom CTA bar ---------- */
  .bottombar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(16,24,40,.07); }
  .bottombar-inner { max-width:1024px; margin:0 auto; padding:10px 20px calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .bb-text { font-size:13.5px; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bb-actions { display:flex; gap:8px; flex:none; }
  .bb-btn { font-size:13px; font-weight:600; text-decoration:none; padding:8px 16px; border-radius:999px; border:1px solid var(--line); color:var(--ink); background:#fff; white-space:nowrap; transition:.15s; }
  .bb-btn:hover { border-color:var(--ink); }
  .bb-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .bb-btn.primary:hover { background:#03644b; }

  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    *, *::before, *::after { transition:none !important; }
  }

  @media (max-width:640px) {
    .brand span { display:none; }
    .nav-link { display:none; }
    .bb-text { display:none; }
    .bottombar-inner { justify-content:center; }
    .preview-row .card { flex-basis:272px; }
  }
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="#top">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Reliable Resources</span>

          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>

        <div class="dropdown" id="dropdown" hidden></div>

</nav>

<header class="hero" id="top">
  <div class="hero-inner">
    <div class="hero-badge"><span class="dot"></span><span id="hero-badge"></span></div>
    <h1 id="tagline"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="stats" id="stats"></div>

</header>

<div class="filters">
  <div class="search-box">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" autocomplete="off" aria-label="search">

</div>

  <div class="bottombar-inner">

      <a class="bb-btn primary" id="bb-submit" target="_blank" rel="noopener"></a>
      <a class="bb-btn" id="bb-report" href="https://github.com/Fangwenky/reliable-resources-for-agent/issues/new" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script>
let RES = [];
let LANG = localStorage.getItem('rra-lang') || 'zh';
let SEG = '';
let UPDATED_AT = '';
const EXPANDED = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REPO = 'https://github.com/Fangwenky/reliable-resources-for-agent';

const CHECK_SVG = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ARROW_SVG = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const CAT_COLOR = {
  academic:['#ede9fe','#6d28d9'], ebooks:['#fef3c7','#b45309'], 'dev-tools':['#dbeafe','#1d4ed8'],
  'ai-tools':['#fae8ff','#a21caf'], media:['#ffe4e6','#be123c'], dataset:['#cffafe','#0e7490'],
  mirror:['#e2e8f0','#475569'], other:['#f2f4f7','#475569']
};

const STR = {
  zh: {
    heroBadge: '人工审核 · HUMAN-REVIEWED',
    tagline: '让 AI 可靠，让信息安全。',
    subtitle: '每一条收录都经过人工审核与官方渠道交叉验证，并持续探活 —— 让 AI 为你配环境、装软件时走官方渠道，更顺利、更安全。',
    searchPh: '搜索资源名称、描述、标签…（中英文皆可）',
    searchLabel: '搜索资源',
    navCat: '分类',
    navAll: '全部资源',
    segAll: '全部', segEndorsed: '推荐', segReference: '防伪', segDead: '已失效',
    statRes: '收录', statCat: '分类', statUpd: '更新',
    totalLine: (n, m) => `共收录 ${n} 条 · ${m} 个分类`,
    showing: m => `找到 ${m} 条`,
    viewAll: n => `查看全部 ${n} 条 →`,
    collapse: '收起 ↑',
    empty: '没有匹配的资源', emptyHint: '换个关键词试试',
    loadFail: '数据加载失败，请稍后重试。',
    evLabel: '验证依据', verifiedAt: '验证于',
    visit: '访问官网',
    deadNote: '该资源已失效，记录保留用于警示仿冒，请勿访问。',
    deadVisit: '已失效',
    risk: '⚠️ 灰色地带资源：请注意版权与合规风险。',
    refNote: '该地址仅用于辨认真伪，本库不做推荐背书。',
    footer: '数据来源 <a href="data.json">data.json</a>（由 <a href="' + REPO + '">GitHub 仓库</a>自动生成）· <a href="' + REPO + '/blob/main/CONTRIBUTING.zh-CN.md">贡献指南</a>',
    bbText: '🔗 发现值得收录的可信站点？',
    bbSubmit: '投稿加入 →',
    bbReport: '报钓鱼站 / 提意见',
    contributingUrl: REPO + '/blob/main/CONTRIBUTING.zh-CN.md',
    cat: {academic:'学术', ebooks:'电子书', 'dev-tools':'开发工具', 'ai-tools':'AI 工具', media:'影音', dataset:'数据集', mirror:'镜像站', other:'其他'},
    status: {active:'可用', degraded:'不稳定', dead:'已失效'},
    ltName: {endorsed:'推荐收录', reference:'防伪收录'},
    htmlLang: 'zh-CN'
  },
  en: {
    heroBadge: 'HUMAN-REVIEWED · 人工审核',
    tagline: "Reliable AI, Secure Information.",
    subtitle: 'Every entry is human-reviewed, cross-verified against official channels, and continuously health-checked — so when AI sets up your environment or installs software, it uses official sources: smoother and safer.',
    searchPh: 'Search name, description, tags… (EN/中文)',
    searchLabel: 'Search resources',
    navCat: 'Categories',
    navAll: 'All resources',
    segAll: 'All', segEndorsed: 'Endorsed', segReference: 'Reference', segDead: 'Dead',
    statRes: 'listed', statCat: 'categories', statUpd: 'updated',
    totalLine: (n, m) => `${n} resources · ${m} categories`,
    showing: m => `${m} found`,
    viewAll: n => `View all ${n} →`,
    collapse: 'Collapse ↑',
    empty: 'No matches', emptyHint: 'Try another keyword',
    loadFail: 'Failed to load data. Please retry later.',
    evLabel: 'VERIFIED', verifiedAt: 'verified ',
    visit: 'Visit site',
    deadNote: 'This resource is dead. The record is kept to warn about impersonators — do not visit.',
    deadVisit: 'Dead',
    risk: '⚠️ Gray-area resource: mind copyright/compliance risks.',
    refNote: 'This address is for authenticity checks only; the registry does not endorse it.',
    footer: 'Data: <a href="data.json">data.json</a> (auto-generated from the <a href="' + REPO + '">GitHub repo</a>) · <a href="' + REPO + '/blob/main/CONTRIBUTING.md">Contributing</a>',
    bbText: '🔗 Spotted a trustworthy site worth listing?',
    bbSubmit: 'Submit it →',
    bbReport: 'Report phishing / feedback',
    contributingUrl: REPO + '/blob/main/CONTRIBUTING.md',
    cat: {academic:'Academia', ebooks:'E-books', 'dev-tools':'Dev Tools', 'ai-tools':'AI Tools', media:'Media', dataset:'Datasets', mirror:'Mirrors', other:'Other'},
    status: {active:'Active', degraded:'Degraded', dead:'Dead'},
    ltName: {endorsed:'Endorsed', reference:'Reference only'},
    htmlLang: 'en'
  }
};

const t = () => STR[LANG];
const rname = r => LANG === 'en' ? (r.name_en || r.name) : r.name;
const rdesc = r => LANG === 'en' ? (r.description_en || r.description) : r.description;
const badge = (cls, txt) => `<span class="badge ${cls}">${esc(txt)}</span>`;
const catsOf = () => [...new Set(RES.map(r => r.category))];
const catColor = c => CAT_COLOR[c] || CAT_COLOR.other;

function monoLetter(r){
  const n = rname(r).trim();
  const ch = n ? [...n][0].toUpperCase() : '?';
  const [bg, fg] = catColor(r.category);
  return `<div class="mono" style="--mb:${bg};--mf:${fg}">${esc(ch)}</div>`;
}

function card(r){
  const s = t();
  const dead = r.status === 'dead';
  const lt = dead ? '' : (r.listing_type === 'reference' ? badge('b-ref', s.ltName.reference) : badge('b-endorse', s.ltName.endorsed));
  const st = badge('b-' + r.status, s.status[r.status] || r.status);
  const v = r.verification || {};
  const mirrors = dead ? '' : (r.mirrors || []).map(m =>
    `<div class="mirror"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a><span class="m-meta">${esc(m.region || '')}${m.region ? ' · ' : ''}${esc(s.verifiedAt)}${esc(m.last_verified || '')}</span></div>`
  ).join('');
  return `<article class="card${dead ? ' is-dead' : ''}">
    <div class="card-top">${monoLetter(r)}
      <div><h2>${esc(rname(r))}</h2>
      <div class="badges">${lt}${st}${badge('b-cat', s.cat[r.category] || r.category)}</div></div>
    </div>
    <p class="desc">${esc(rdesc(r))}</p>
    ${r.risk === 'gray-area' ? `<div class="risk">${esc(s.risk)}</div>` : ''}
    ${r.listing_type === 'reference' ? `<div class="ref-note">${esc(s.refNote)}</div>` : ''}
    <div class="evidence">${CHECK_SVG}<div>
      <div class="ev-label">${esc(s.evLabel)}</div>
      <div class="ev-text">${esc(v.evidence || '')}</div>
      <div class="ev-meta">${esc(v.method || '')} · ${esc(v.verified_at || '')}</div>
    </div></div>
    ${mirrors ? `<div class="mirrors">${mirrors}</div>` : ''}
    ${dead
      ? `<div class="dead-note">${esc(s.deadNote)}</div><span class="visit disabled" aria-disabled="true"><span>${esc(s.deadVisit)}</span></span>`
      : `<a class="visit" href="${esc(r.homepage)}" target="_blank" rel="noopener"><span>${esc(s.visit)}</span>${ARROW_SVG}</a>`}
  </article>`;
}

function sectionHTML(c, list){
  const s = t();
  const items = list.filter(r => r.category === c);
  if (!items.length) return '';
  const expanded = EXPANDED.has(c);
  const [dot] = catColor(c);
  return `<section class="cat-section" id="sec-${esc(c)}">
    <div class="cat-head">
      <div class="cat-title">
        <span class="cat-dot" style="background:${dot}"></span>
        <h2>${esc(s.cat[c] || c)}</h2>
        <span class="cat-count">${items.length}</span>
      </div>
      <button class="expand-btn" data-cat="${esc(c)}">${esc(expanded ? s.collapse : s.viewAll(items.length))}</button>
    </div>
    <div class="${expanded ? 'grid-expanded' : 'preview-row'}">${items.map(card).join('')}</div>
  </section>`;
}

function renderGrouped(){
  const s = t();
  const live = RES.filter(r => r.status !== 'dead');
  $('sections').hidden = false;
  $('grid').hidden = true;
  $('meta').textContent = s.totalLine(live.length, catsOf().length);
  $('sections').innerHTML = catsOf().map(c => sectionHTML(c, live)).join('');
  $('sections').querySelectorAll('.expand-btn').forEach(b =>
    b.addEventListener('click', () => {
      const c = b.dataset.cat;
      EXPANDED.has(c) ? EXPANDED.delete(c) : EXPANDED.add(c);
      renderGrouped();
    }));
}

function renderFlat(q){
  const s = t();
  const list = RES.filter(r => {
    if (SEG === 'dead') {
      // 归档视图：只看已失效
      if (r.status !== 'dead') return false;
    } else {
      // 默认视图与推荐/防伪筛选排除 dead；但有搜索词时保留 dead 命中（辨伪查询）
      if (!q && r.status === 'dead') return false;
      if (SEG && r.listing_type !== SEG) return false;
    }
    const hay = [r.name, r.name_en, r.description, r.description_en, r.id, (r.tags || []).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
  $('sections').hidden = true;
  $('grid').hidden = false;
  $('meta').textContent = s.showing(list.length);
  $('grid').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty"><div class="big">🔍</div><div>${esc(s.empty)}</div><div style="margin-top:6px;font-size:13px">${esc(s.emptyHint)}</div></div>`;
}

function render(){
  const q = $('q').value.trim().toLowerCase();
  if (q || SEG) renderFlat(q); else renderGrouped();
}

function renderSeg(){
  const s = t();
  const opts = [['', s.segAll], ['endorsed', s.segEndorsed], ['reference', s.segReference], ['dead', s.segDead]];
  $('seg').innerHTML = opts.map(([v, label]) =>
    `<button class="${SEG === v ? 'on' : ''}" data-v="${v}">${esc(label)}</button>`).join('');
  $('seg').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { SEG = b.dataset.v; renderSeg(); render(); }));
}

function renderStats(updatedAt){
  const s = t();
  const cats = catsOf().length;
  $('stats').innerHTML = [
    [RES.length, s.statRes], [cats, s.statCat], [updatedAt || '—', s.statUpd]
  ].map(([v, label]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(label)}</span></div>`).join('');
}

function renderDropdown(){
  const s = t();
  const cats = catsOf();
  $('cat-btn-label').textContent = s.navCat;
  $('dropdown').innerHTML =
    `<button data-c="">${esc(s.navAll)}</button>` +
    cats.map(c => {
      const n = RES.filter(r => r.category === c).length;
      return `<button data-c="${esc(c)}"><span>${esc(s.cat[c] || c)}</span><span class="cnt">${n}</span></button>`;
    }).join('');
  $('dropdown').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { jumpToCat(b.dataset.c); closeDropdown(); }));
}

function closeDropdown(){
  $('dropdown').hidden = true;
  $('nav-dropdown').classList.remove('open');
  $('cat-btn').setAttribute('aria-expanded', 'false');
}

function jumpToCat(c){
  if (!c) {
    if ($('q').value.trim() || SEG) { $('q').value = ''; SEG = ''; renderSeg(); render(); }
    document.getElementById('top').scrollIntoView({behavior:'smooth'});
    return;
  }
  if ($('q').value.trim() || SEG) { $('q').value = ''; SEG = ''; renderSeg(); }
  EXPANDED.add(c);
  renderGrouped();
  requestAnimationFrame(() => {
    const el = document.getElementById('sec-' + c);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function applyLang(){
  const s = t();
  document.documentElement.lang = s.htmlLang;
  document.title = LANG === 'en' ? 'Reliable Resources for Agent' : 'Reliable Resources for Agent — 可信资源库';
  $('hero-badge').textContent = s.heroBadge;
  $('tagline').textContent = s.tagline;
  $('subtitle').textContent = s.subtitle;
  $('q').placeholder = s.searchPh;
  $('q').setAttribute('aria-label', s.searchLabel);
  $('lang-zh').classList.toggle('on', LANG === 'zh');
  $('lang-en').classList.toggle('on', LANG === 'en');
  $('footer').innerHTML = s.footer;
  $('bb-text').textContent = s.bbText;
  $('bb-submit').textContent = s.bbSubmit;
  $('bb-submit').href = s.contributingUrl;
  $('bb-report').textContent = s.bbReport;
  renderSeg(); renderDropdown(); renderStats(UPDATED_AT); render();
}

function setLang(l){ LANG = l; localStorage.setItem('rra-lang', l); applyLang(); }
$('lang-zh').addEventListener('click', () => setLang('zh'));
$('lang-en').addEventListener('click', () => setLang('en'));
$('cat-btn').addEventListener('click', e => {
  e.stopPropagation();
  const dd = $('dropdown');
  const open = dd.hidden;
  closeDropdown();
  if (open) { dd.hidden = false; $('nav-dropdown').classList.add('open'); $('cat-btn').setAttribute('aria-expanded', 'true'); }
});
document.addEventListener('click', e => { if (!$('nav-dropdown').contains(e.target)) closeDropdown(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDropdown(); });

fetch('data.json').then(r => r.json()).then(d => {
  RES = d.resources || [];
  UPDATED_AT = d.updated_at;
  applyLang();
}).catch(() => {
  $('sections').hidden = true; $('grid').hidden = false;
  $('grid').innerHTML = `<div class="empty"><div class="big">⚠️</div><div>${esc(t().loadFail)}</div></div>`;
});

$('q').addEventListener('input', render);
</script>
</body>
</html>
